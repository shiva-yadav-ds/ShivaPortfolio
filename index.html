<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Metadata -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11130f" />

    <!-- Title and Favicon -->
    <title>Shiva Yadav | Data Scientist Portfolio</title>
    <link rel="icon" type="image/png" href="/src/assets/favicon.png" />

    <!-- SEO Metadata -->
    <meta
      name="description"
      content="Shiva Yadav | Data Science student at IIT Madras and Python developer. Explore projects in machine learning, data analysis, and thoughtful web development."
    />
    <meta
      name="keywords"
      content="Shiva Yadav, Shiva Data Scientist, Shiva IIT Madras, Shiva Portfolio, Data Scientist Portfolio, Python Developer, Machine Learning Engineer, SQL, Data Analysis, IIT Madras Student"
    />
    <meta name="author" content="Shiva Yadav" />

    <!-- Open Graph (OG) for Social Media Sharing -->
    <meta
      property="og:title"
      content="Shiva Yadav | Data Scientist & Python Developer"
    />
    <meta
      property="og:description"
      content="Portfolio of Shiva Yadav, a Data Science student at IIT Madras. Explore projects in Machine Learning, Data Analysis, and Full Stack Development."
    />
    <meta
      property="og:image"
      content="https://shiva-yadav-ds.vercel.app/logo.png"
    />
    <meta property="og:url" content="https://shiva-yadav-ds.vercel.app/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Shiva Yadav | Data Scientist Portfolio"
    />
    <meta
      name="twitter:description"
      content="Shiva Yadav: IIT Madras Data Science student & Python Developer. Check out my data science projects and skills."
    />
    <meta
      name="twitter:image"
      content="https://shiva-yadav-ds.vercel.app/logo.png"
    />

    <!-- JSON-LD Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Shiva Yadav",
        "url": "https://shiva-yadav-ds.vercel.app/",
        "image": "https://shiva-yadav-ds.vercel.app/logo.png",
        "jobTitle": "Data Scientist",
        "affiliation": { "@type": "CollegeOrUniversity", "name": "IIT Madras" },
        "sameAs": [
          "https://www.linkedin.com/in/shiva-yadav-4043912b9/",
          "https://github.com/shiva-yadav-ds"
        ],
        "description": "Aspiring Data Scientist and Python Developer studying at IIT Madras, specializing in Machine Learning and Data Analysis."
      }
    </script>

    <!-- Robots and Indexing -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://shiva-yadav-ds.vercel.app/" />

    <!-- Self-hosted fonts: discovered before the JavaScript application starts. -->
    <link
      rel="preload"
      href="/src/assets/fonts/dm-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/dm-serif-display-italic-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

</html>
